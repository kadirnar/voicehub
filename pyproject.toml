[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voicehub"
dynamic = ["version"]
description = "A unified inference and training interface for TTS, ASR, VAD, and audio codec models"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "kadirnardev", email = "kadir.nar@hotmail.com" }]
keywords = [
  "automatic-speech-recognition",
  "speech",
  "text-to-speech",
  "transformers",
  "tts",
  "voice-activity-detection",
  "voice-cloning",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Typing :: Typed",
]
dependencies = [
  # VoiceHub owns every built-in speech and codec architecture. PyTorch is
  # the only tensor/autograd substrate in the default inference runtime.
  # Training/reporting tools intentionally live in `voicehub[training]`.
  "torch>=2.8,<2.9",
]

[project.urls]
Homepage = "https://github.com/kadirnar/voicehub"
Repository = "https://github.com/kadirnar/voicehub"
Issues = "https://github.com/kadirnar/voicehub/issues"
Documentation = "https://kadirnar.github.io/voicehub/"

[project.optional-dependencies]
docs = [
  "axe-playwright-python==0.1.8",
  "mkdocs-material==9.7.7",
  "mkdocs-static-i18n==1.3.1",
  "pillow==12.3.0",
  "playwright==1.62.0",
]
training = [
  "ema-pytorch",
  "datasets",
  "evaluate",
  "jiwer",
  "pyarrow",
  "pyworld",
  "wandb>=0.19",
]
test = [
  "build>=1.2",
  "coqpit>=0.0.16",
  "einops",
  "librosa>=0.10",
  "matplotlib",
  "mutagen",
  "nbformat>=5.10",
  # librosa's broad transitive range otherwise admits numba releases that do
  # not support VoiceHub's Python 3.12 test environment.
  "numba>=0.59",
  "numpy>=1.23",
  "packaging",
  "pandas",
  "pre-commit",
  "pytest",
  "scipy",
  "soundfile>=0.12",
  "torchaudio>=2.8,<2.9",
  "transformers>=5.14,<6",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "voicehub.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["voicehub*"]
exclude = ["tests*"]
