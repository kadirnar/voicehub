# Define bot property if installed via https://github.com/marketplace/pre-commit-ci
ci:
  autofix_prs: true
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit suggestions'
  autoupdate_schedule: monthly
  # GitHub Actions runs formatters against the changed-file range. Running
  # them over every historical provider in pre-commit.ci exceeds its timeout.
  skip:
    - isort
    - yapf
    - docformatter
  # submodules: true

exclude: ^(?:voicehub/models/.*/source/|voicehub/models/asr_native/_wenet/|voicehub/components/(?:audio|neural)/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-case-conflict
      # - id: no-commit-to-branch
      # - id: check-yaml
      - id: detect-private-key
      - id: detect-aws-credentials
        args:
          - --allow-missing-credentials

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        name: Upgrade code

  - repo: https://github.com/PyCQA/isort
    rev: 9.0.0b1
    hooks:
      - id: isort
        name: Sort imports

  - repo: https://github.com/google/yapf
    rev: v0.43.0
    hooks:
      - id: yapf
        name: YAPF formatting
        args:
          - -i

  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        name: MD formatting
        additional_dependencies:
          - mdformat-gfm
          - mdformat-black
        exclude: '^(?:docs/.*\.md|notebooks/models/README\.md|\.ai/skills/[^/]+/SKILL\.md)$'

  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        name: Flake8 linting

  - repo: https://github.com/PyCQA/docformatter
    rev: v1.7.8
    hooks:
      - id: docformatter
        exclude: '^(?:scripts/(?:documentation_references|generate_(?:model_(?:notebooks|pages)|optimization_pages)|scaffold_model)|tests/test_model_scaffold)\.py$'
