site_name: VoiceHub Docs
site_description: Unified inference, data preparation, and training for modern TTS, ASR, and VAD models.
site_author: VoiceHub contributors
site_url: https://kadirnar.github.io/voicehub/
repo_url: https://github.com/kadirnar/voicehub
repo_name: kadirnar/voicehub
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
use_directory_urls: true
strict: true

theme:
  name: material
  language: en
  font: false
  custom_dir: overrides
  logo: assets/voicehub-mark.svg
  favicon: assets/voicehub-mark.svg
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

